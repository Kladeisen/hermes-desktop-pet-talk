name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        # Backend half runs on the Hermes dashboard's own stack; aiortc/av cover the optional
        # Discord live-voice lane. 4 tests fail at this snapshot - see README "Tests".
        run: pip install pytest fastapi httpx pillow PyYAML 'aiortc>=1.15,<2'
      - name: Tests
        run: python -m pytest -q
      - name: Compile backend
        run: python -m py_compile dashboard/plugin_api.py
      - name: Syntax-check desktop half
        run: node --check desktop/plugin.js
      - name: Desktop plugin load harness (ESM import with stubs)
        run: bash tools/plugin-load-test.sh