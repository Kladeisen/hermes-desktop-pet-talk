name: talk-desktop-alerts
version: "0.2.0"
description: Reports this bot profile's approval, question and sudo waits, and its current step (thinking / tool / done), to the talk-desktop pets. Hooks only; no voice, UI or network.
provides_hooks:
  - on_human_input_request
  - on_human_input_resolved
  - pre_api_request
  - api_request_error
  - post_api_request
  - pre_tool_call
  - post_tool_call
  - on_session_end
